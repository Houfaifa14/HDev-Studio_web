<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HDev Studio — Admin Dashboard</title>
<style>
:root {
  --site-primary: #6657ff;
  --site-secondary: #00d5ff;
  --site-background: #080a18;
  --site-on-background: #f5f6ff;
  --site-font: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--site-font); background: var(--site-background); color: var(--site-on-background); padding: 20px; }
.shell { max-width: 1100px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 24px; border-bottom: 1px solid rgba(160,165,255,.14); margin-bottom: 30px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 850; font-size: 1.2rem; }
.brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(145deg, var(--site-primary), #3120a6, var(--site-secondary)); color: #fff; }
.badge { background: rgba(0, 213, 255, 0.15); color: var(--site-secondary); border: 1px solid var(--site-secondary); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
.btn-logout { background: #26162d; border: 1px solid #ff4757; color: #ff4757; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; text-decoration: none; transition: 0.2s; }
.btn-logout:hover { background: #ff4757; color: #fff; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 35px; }
.stat-card { background: linear-gradient(145deg, rgba(24,27,57,.9), rgba(13,15,35,.92)); border: 1px solid rgba(139,143,221,.19); padding: 20px; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
.stat-title { color: #a5accf; font-size: 0.85rem; margin-bottom: 8px; }
.stat-value { font-size: 1.8rem; font-weight: 900; color: #fff; }
.stat-value span { font-size: 0.9rem; color: var(--site-secondary); }

.panel { background: rgba(18,20,44,.8); border: 1px solid #34375e; border-radius: 20px; padding: 24px; margin-bottom: 30px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.panel-title { font-size: 1.1rem; font-weight: 800; margin: 0; }
.table-responsive { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: right; font-size: 0.9rem; }
th, td { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); white-space: nowrap; }
th { color: #8f95b9; font-weight: 700; background: rgba(10, 12, 30, 0.5); }
tr:hover { background: rgba(255,255,255,0.02); }

/* تنسيق خيارات حالة الطلب */
select.status-select {
  background: #0b0e22;
  color: #fff;
  border: 1px solid #383d68;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 0.82rem;
  cursor: pointer;
  outline: none;
}
.btn-delete {
  background: rgba(255, 71, 87, 0.15);
  color: #ff4757;
  border: 1px solid #ff4757;
  padding: 5px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: 0.2s;
}
.btn-delete:hover {
  background: #ff4757;
  color: #fff;
}
.empty-msg { text-align: center; color: #8f95b8; padding: 20px; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="brand-mark">H</div>
      <span>HDev Studio <span class="badge">لوحة التحكم الإدارية</span></span>
    </div>
    <a href="index.html" class="btn-logout">الخروج للموقع الرئيسي</a>
  </header>

  <!-- الإحصائيات -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-title">إجمالي الزيارات</div>
      <div class="stat-value" id="statVisits">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">عدد الطلبات المستلمة</div>
      <div class="stat-value" id="statOrders">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">نسبة التحويل الفعلية</div>
      <div class="stat-value" id="statConversion">0%</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">الطلبات المكتملة</div>
      <div class="stat-value" id="statCompleted">0</div>
    </div>
  </div>

  <!-- جدول الطلبات -->
  <div class="panel">
    <div class="panel-head">
      <h2 class="panel-title">إدارة الطلبات الواردة</h2>
    </div>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>الاسم</th>
            <th>وسيلة التواصل</th>
            <th>نوع المشروع</th>
            <th>الميزانية</th>
            <th>تفاصيل الفكرة</th>
            <th>التاريخ</th>
            <th>الحالة والتغيير</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="realOrdersTable">
          <!-- تُعبأ ديناميكياً من الـ localStorage -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
// التحقق من صلاحية الجلسة
if (sessionStorage.getItem('isAdmin') !== 'true') {
  alert('عذراً، يجب تسجيل الدخول أولاً بالنقر المزدوج على الشعار في الصفحة الرئيسية!');
  window.location.href = 'index.html';
}

// تحميل البيانات وحساب الإحصائيات
function loadDashboardData() {
  const visits = parseInt(localStorage.getItem('hdev_visits')) || 0;
  const orders = JSON.parse(localStorage.getItem('hdev_orders')) || [];

  document.getElementById('statVisits').textContent = visits;
  document.getElementById('statOrders').textContent = orders.length;

  let conversion = visits > 0 ? ((orders.length / visits) * 100).toFixed(2) : 0;
  document.getElementById('statConversion').textContent = conversion + '%';

  // حساب الطلبات المكتملة
  const completedCount = orders.filter(o => o.status === 'مكتمل').length;
  document.getElementById('statCompleted').textContent = completedCount;

  const tableBody = document.getElementById('realOrdersTable');
  tableBody.innerHTML = '';

  if (orders.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="8" class="empty-msg">لا توجد أي طلبات مستلمة حتى الآن.</td></tr>`;
    return;
  }

  orders.forEach((order, index) => {
    const tr = document.createElement('tr');
    
    // تحديد الخيار المحدد حالياً
    const statusPending = order.status === 'قيد المراجعة' ? 'selected' : '';
    const statusCompleted = order.status === 'مكتمل' ? 'selected' : '';
    const statusCanceled = order.status === 'ملغى' ? 'selected' : '';

    tr.innerHTML = `
      <td>${order.name}</td>
      <td>${order.contact}</td>
      <td>${order.kind}</td>
      <td>${order.budget}</td>
      <td>${order.details}</td>
      <td>${order.date}</td>
      <td>
        <select class="status-select" onchange="updateStatus(${index}, this.value)">
          <option value="قيد المراجعة" ${statusPending}>⏳ قيد المراجعة</option>
          <option value="مكتمل" ${statusCompleted}>✅ مكتمل</option>
          <option value="ملغى" ${statusCanceled}>❌ ملغى</option>
        </select>
      </td>
      <td>
        <button class="btn-delete" onclick="deleteOrder(${index})">حذف</button>
      </td>
    `;
    tableBody.appendChild(tr);
  });
}

// وظيفة تحديث حالة الطلب
function updateStatus(index, newStatus) {
  let orders = JSON.parse(localStorage.getItem('hdev_orders')) || [];
  if (orders[index]) {
    orders[index].status = newStatus;
    localStorage.setItem('hdev_orders', JSON.stringify(orders));
    loadDashboardData(); // إعادة تحديث العرض والأرقام
  }
}

// وظيفة حذف الطلب
function deleteOrder(index) {
  if (confirm('هل أنت تأكد من رغبتك في حذف هذا الطلب نهائياً؟')) {
    let orders = JSON.parse(localStorage.getItem('hdev_orders')) || [];
    orders.splice(index, 1);
    localStorage.setItem('hdev_orders', JSON.stringify(orders));
    loadDashboardData(); // إعادة تحديث العرض والأرقام
  }
}

loadDashboardData();
</script>
</body>
</html>
